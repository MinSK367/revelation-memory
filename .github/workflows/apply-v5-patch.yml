name: Apply v5 patch

on:
  push:
    paths:
      - '.github/workflows/apply-v5-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply memorization difficulty patch
        run: |
          echo '' | base64 -d > /tmp/v5.patch
          patch -p0 < /tmp/v5.patch
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase level 1 and 2 memorization difficulty"
          git push
