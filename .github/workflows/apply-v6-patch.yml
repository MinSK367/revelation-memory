name: Apply v6 site patch

on:
  push:
    paths:
      - '.github/workflows/apply-v6-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stored patch
        run: git apply .github/patches/v6.patch
      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve verse input, grading, and wrong-answer diff"
          git push
