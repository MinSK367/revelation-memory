<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>RV-M 음성 암송</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* Layout: one narrow study column — prompt card, answer box, graded verse. Thumb-reachable buttons. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#17202C; --muted:#5D6A7A; --line:#D9DEE5;
  --accent:#28507A; --accent-ink:#FFFFFF; --ok:#1F7A4A; --ok-soft:#E3F3EA; --bad:#B8322A; --bad-soft:#FBE7E5;
  --font-body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-verse:"Noto Serif KR","AppleMyungjo","Batang",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#18202A; --ink:#E6EAF0; --muted:#9AA6B5; --line:#2C3644;
  --accent:#7FA8D6; --accent-ink:#0E1620; --ok:#5CC28B; --ok-soft:#173226; --bad:#F07A70; --bad-soft:#3A1E1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --ink:#E6EAF0; --muted:#9AA6B5; --line:#2C3644;
  --accent:#7FA8D6; --accent-ink:#0E1620; --ok:#5CC28B; --ok-soft:#173226; --bad:#F07A70; --bad-soft:#3A1E1C; color-scheme:dark}
*{box-sizing:border-box}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,.verse{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap[hidden]{display:none}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ref{font-family:var(--font-verse);font-size:30px;font-weight:700;letter-spacing:-.02em}
.ref small{font-size:15px;color:var(--muted);font-family:var(--font-body);font-weight:400;margin-left:8px}
textarea{width:100%;min-height:150px;font:inherit;font-size:17px;line-height:1.7;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.interim{color:var(--muted);font-size:14px;min-height:1.4em}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:14px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.grow{flex:1}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-size:17px}
.mic .dot{width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.5}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.mic.on .dot{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.mic.on .dot{animation:none}}
.tip{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.verdict{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;font-size:20px;flex:none}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.bad{background:var(--bad-soft);color:var(--bad)}
.verse{font-family:var(--font-verse);font-size:18px;line-height:2}
.miss{color:var(--bad);background:var(--bad-soft);text-decoration:underline;text-decoration-thickness:2px;border-radius:2px}
.extra{color:var(--bad);font-size:.75em;vertical-align:super;font-family:var(--font-body);text-decoration:line-through}
.counts{font-size:14px;color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.vitem.bad{border-color:var(--bad)}
.vhead{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.vhead .ok{color:var(--ok)} .vhead .bad{color:var(--bad)}
.score{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.full{border-color:var(--ok);color:var(--ok)}
h2{font-size:15px;margin:0}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;padding:0;cursor:pointer;text-decoration:underline}
</style>

<div class="wrap" hidden>
  <header>
    <h1>RV-M 음성 암송</h1>
    <span class="sub">요한계시록 개역한글 · 말로 외우고 글자 단위 채점</span>
  </header>

  <div class="tabs" role="group" aria-label="연습 방식">
    <button id="tabVerse" aria-pressed="true">한 절씩</button>
    <button id="tabChapter" aria-pressed="false">장 전체</button>
  </div>

  <div class="row">
    <select id="selCh" aria-label="장"></select>
    <select id="selV" aria-label="절"></select>
    <button class="link" id="btnWrongOnly" hidden>틀린 절만 다시</button>
  </div>

  <section class="card" id="promptCard">
    <div class="ref" id="ref">1장 1절</div>
    <button class="btn mic" id="btnMic" hidden><span class="dot"></span><span id="micLabel">한 번 눌러 말하기 시작</span></button>
    <div class="interim" id="interim" aria-live="polite"></div>
    <label for="answer" class="sub">말한 내용 (잘못 알아들은 글자는 직접 고쳐도 돼요)</label>
    <textarea id="answer" placeholder="여기를 누르고 아이폰 키보드 아래쪽 마이크 버튼을 누르면 받아써져요."></textarea>
    <div class="tip" id="tip"></div>
    <div class="row">
      <button class="btn" id="btnClear">지우기</button>
      <button class="btn primary grow" id="btnGrade">채점하기</button>
    </div>
  </section>

  <section class="card" id="resultCard" hidden></section>

  <section class="card">
    <h2>내 기록 <span class="sub">(이 기기에만 저장)</span></h2>
    <div class="chips" id="history"></div>
    <div class="sub" id="historyNote"></div>
    <button class="link" id="btnForget" hidden></button>
  </section>
</div>

<p id="loadStatus" role="status">본문을 불러오는 중…</p>
<script>
async function initializeRecite(){
const response=await fetch('./revelation_korean.json');
if(!response.ok)throw new Error('Could not load the Revelation text');
const {verses:VERSES}=await response.json();
if(!VERSES?.['1:1'])throw new Error('Invalid Revelation text');
const CH = {}; for (const k of Object.keys(VERSES)) { const [c,v]=k.split(':').map(Number); (CH[c] ||= []).push(v); }
for (const c in CH) CH[c].sort((a,b)=>a-b);

/* ---------- 기록 ---------- */
const KEY='rvVoiceRecite1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{chapters:{},wrong:{}} }catch{ return {chapters:{},wrong:{}} } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)) }catch{} }
let store = load(); store.chapters ||= {}; store.wrong ||= {}; store.accepted ||= {};

/* ---------- 숫자 → 한글 (받아쓰기가 '7', '144,000'처럼 숫자로 적는 경우) ---------- */
const D=['','일','이','삼','사','오','육','칠','팔','구'];
function sino4(n){ const u=['','십','백','천']; let s=''; const d=String(n).padStart(4,'0'); for(let i=0;i<4;i++){const x=+d[i]; if(!x) continue; s+=(x===1&&i<3?'':D[x])+u[3-i];} return s; }
function sino(n){ if(n===0) return '영'; const man=Math.floor(n/10000), rest=n%10000; return (man? (man===1?'':sino4(man))+'만':'')+sino4(rest); }
const N1=['','한','두','세','네','다섯','여섯','일곱','여덟','아홉'], N1b=['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'];
const T=['','열','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];
function natives(n){ if(n<1||n>99) return []; const t=Math.floor(n/10), o=n%10;
  const a=T[t]+N1[o], b=T[t]+N1b[o]; const out=[a,b]; if(n===20) out.push('스무'); return [...new Set(out)]; }
function fixDigits(input, target){
  return input.replace(/\d[\d,]*/g, m=>{
    const n=parseInt(m.replace(/,/g,''),10); if(!isFinite(n)) return m;
    // 개역한글 표기 변형: '일천'처럼 앞에 '일'을 붙이거나, '륙'으로 적는 경우
    const s=sino(n), sv=[s, s.replace(/육/g,'륙'), s.replace(/육$/,'륙')];
    if(/^[십백천만]/.test(s)) sv.push(...sv.map(x=>'일'+x));
    const c=[...natives(n), ...sv].filter(Boolean).sort((a,b)=>b.length-a.length);
    return c.find(x=>target.includes(x)) || sino(n);
  });
}

/* ---------- 채점: 공백·문장부호 빼고 글자 단위 비교 ---------- */
const isChar = ch => /[\p{L}\p{N}]/u.test(ch);
const norm = s => [...s].filter(isChar).join('');
const JUNG={1:5,3:7,10:11,15:11};
const sound = s => [...s].map(ch=>{ const i=ch.charCodeAt(0)-0xAC00; if(i<0||i>11171) return ch; const j=Math.floor(i/28)%21; return j in JUNG ? String.fromCharCode(0xAC00+i+(JUNG[j]-j)*28) : ch; }).join('');
function lcsOps(a, b, raw=b){ // a=정답, b=답안(비교용), raw=답안(보여주기용)
  const n=a.length, m=b.length, W=m+1, dp=new Uint16Array((n+1)*W);
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i*W+j] = a[i]===b[j] ? dp[(i+1)*W+j+1]+1 : Math.max(dp[(i+1)*W+j], dp[i*W+j+1]);
  const miss=new Uint8Array(n), extra=Array.from({length:n+1},()=>'' ); let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){i++;j++;} else if(dp[(i+1)*W+j]>=dp[i*W+j+1]){miss[i]=1;i++;} else {extra[i]+=raw[j];j++;} }
  while(i<n){miss[i]=1;i++;} while(j<m){extra[n]+=raw[j];j++;}
  return {miss, extra};
}
// 여러 절을 이어서 채점하고 절별로 나눠 돌려준다
function grade(keys, answer){
  const targets = keys.map(k=>norm(VERSES[k]));
  const all = targets.join('');
  const ans = norm(fixDigits(answer, all));
  const {miss, extra} = lcsOps(sound(all), sound(ans), ans);
  let off=0; const res=[];
  keys.forEach((k,idx)=>{
    const len=targets[idx].length, last=idx===keys.length-1;
    const m=miss.slice(off,off+len), ex=extra.slice(off, off+len+(last?1:0));
    const missN=m.reduce((s,x)=>s+x,0), extraN=ex.reduce((s,x)=>s+x.length,0);
    let heard=''; for(let i=0;i<len;i++){ heard+=ex[i]; if(!m[i]) heard+=targets[idx][i]; } if(last) heard+=ex[len];
    const exact=missN===0&&extraN===0, accepted=!exact && (store.accepted[k]||[]).includes(sound(heard));
    res.push({key:k, miss:m, extra:ex, missN, extraN, heard, exact, accepted, ok:exact||accepted});
    off+=len;
  });
  return res;
}
const esc = s => s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderVerse(r){
  const text=VERSES[r.key]; let k=0, html='';
  for(const ch of text){
    if(!isChar(ch)){ html+=esc(ch); continue; }
    if(r.extra[k]) html+=`<span class="extra" title="더 말한 글자">${esc(r.extra[k])}</span>`;
    html+= r.miss[k] ? `<span class="miss">${esc(ch)}</span>` : esc(ch);
    k++;
  }
  if(r.extra[k]) html+=`<span class="extra">${esc(r.extra[k])}</span>`;
  return html;
}

/* ---------- 화면 ---------- */
const $=id=>document.getElementById(id);
let mode='verse', wrongOnly=null;
function fillChapters(){ $('selCh').innerHTML = Object.keys(CH).map(c=>`<option value="${c}">${c}장</option>`).join(''); }
function fillVerses(){ const c=+$('selCh').value; $('selV').innerHTML = CH[c].map(v=>`<option value="${v}">${v}절</option>`).join(''); }
function currentKeys(){
  const c=+$('selCh').value;
  if(mode==='verse') return [`${c}:${$('selV').value}`];
  if(wrongOnly) return wrongOnly;
  return CH[c].map(v=>`${c}:${v}`);
}
function updatePrompt(){
  const c=+$('selCh').value;
  $('selV').hidden = mode!=='verse';
  if(mode==='verse') $('ref').innerHTML = `${c}장 ${$('selV').value}절`;
  else if(wrongOnly) $('ref').innerHTML = `${c}장 <small>틀린 절 ${wrongOnly.map(k=>k.split(':')[1]).join(', ')}절</small>`;
  else $('ref').innerHTML = `${c}장 <small>1~${CH[c].length}절 전체</small>`;
  $('btnWrongOnly').hidden = true;
}
function setMode(m){ mode=m; wrongOnly=null; $('tabVerse').setAttribute('aria-pressed', m==='verse'); $('tabChapter').setAttribute('aria-pressed', m==='chapter'); clearAll(); updatePrompt(); }
function clearAll(){ stopMic(true); base=''; $('answer').value=''; $('interim').textContent=''; $('resultCard').hidden=true; }

function showResult(res){
  res.forEach(r=>{ if(r.ok) delete store.wrong[r.key]; else store.wrong[r.key]=(store.wrong[r.key]||0)+1; });
  renderResult(res);
  $('resultCard').scrollIntoView({behavior:'smooth',block:'start'});
}
// 휴대폰이 잘못 받아쓴 것을 사용자가 정답으로 인정: 같은 절에서 똑같이 들리면 다음부터 자동으로 정답
function acceptHeard(res, key){
  const r=res.find(x=>x.key===key); if(!r) return;
  (store.accepted[key] ||= []).includes(sound(r.heard)) || store.accepted[key].push(sound(r.heard));
  r.accepted=r.ok=true; delete store.wrong[key]; renderResult(res);
}
const acceptBtn = r => `<button class="link" data-accept="${r.key}">맞게 말했어요 (휴대폰이 잘못 들음)</button>`;
function renderResult(res){
  const card=$('resultCard'); card.hidden=false;
  const okN=res.filter(r=>r.ok).length;
  const note = `<p class="sub">빨간 글자는 빠뜨렸거나 다르게 들린 부분이에요. 위첨자 취소선은 더 들어간 글자예요. 분명히 맞게 말했는데 휴대폰이 잘못 들은 거라면 <b>맞게 말했어요</b>를 누르세요. 이 절에서 똑같이 들리면 다음부터는 정답으로 쳐요.</p>`;
  const acc = `<p class="sub">휴대폰이 잘못 들은 것으로 인정한 답이에요.</p>`;
  if(mode==='verse'){
    const r=res[0];
    card.innerHTML = `<div class="verdict"><span class="badge ${r.ok?'ok':'bad'}">${r.ok?'O':'X'}</span>${r.ok?'정확히 외웠어요':'다시 확인할 부분이 있어요'}</div>
      <div class="verse">${renderVerse(r)}</div>
      <div class="counts">빠뜨린 글자 ${r.missN}개 · 더 들어간 글자 ${r.extraN}개</div>
      ${r.accepted?acc:''}${r.ok?'':note+acceptBtn(r)}
      <div class="row"><button class="btn grow" id="btnRetry">다시 말하기</button><button class="btn primary grow" id="btnNext">다음 절</button></div>`;
    $('btnRetry').onclick=()=>{ clearAll(); window.scrollTo({top:0,behavior:'smooth'}); };
    $('btnNext').onclick=nextVerse;
  } else {
    const c=+$('selCh').value, full=!wrongOnly;
    if(full){ store.chapters[c]={ok:okN,total:res.length,at:new Date().toISOString().slice(0,10),best:Math.max(okN,store.chapters[c]?.best||0)}; }
    const wrong=res.filter(r=>!r.ok);
    card.innerHTML = `<div class="score">${okN} / ${res.length}<span class="sub"> 절 정확</span></div>
      <div class="counts">${wrong.length? `틀린 절: ${wrong.map(r=>r.key.split(':')[1]).join(', ')}절` : '모든 절을 정확히 외웠어요.'}</div>
      ${wrong.length?note:''}
      <div class="vlist">${res.map(r=>`<div class="vitem ${r.ok?'':'bad'}"><div class="vhead"><span>${r.key.split(':')[1]}절</span><span class="${r.ok?'ok':'bad'}">${r.ok?(r.accepted?'O · 인정':'O'):`X · 빠짐 ${r.missN} · 더함 ${r.extraN}`}</span></div>${r.exact?'':`<div class="verse">${renderVerse(r)}</div>`}${r.ok?'':acceptBtn(r)}</div>`).join('')}</div>
      ${wrong.length?`<button class="btn primary" id="btnRedoWrong">틀린 ${wrong.length}절만 다시 말하기</button>`:''}`;
    if(wrong.length) $('btnRedoWrong').onclick=()=>{ wrongOnly=wrong.map(r=>r.key); clearAll(); updatePrompt(); window.scrollTo({top:0,behavior:'smooth'}); };
  }
  card.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>acceptHeard(res, b.dataset.accept));
  save(); renderHistory();
}
function nextVerse(){
  const c=+$('selCh').value, vs=CH[c], i=vs.indexOf(+$('selV').value);
  if(i<vs.length-1) $('selV').value=vs[i+1];
  else if(CH[c+1]){ $('selCh').value=c+1; fillVerses(); }
  clearAll(); updatePrompt(); window.scrollTo({top:0,behavior:'smooth'});
}
function renderHistory(){
  const cs=Object.keys(store.chapters).sort((a,b)=>a-b);
  $('history').innerHTML = cs.length ? cs.map(c=>{const h=store.chapters[c]; return `<span class="chip ${h.ok===h.total?'full':''}" title="최고 ${h.best}">${c}장 ${h.ok}/${h.total}</span>`}).join('') : '<span class="sub">아직 장 전체 기록이 없어요. 장 전체로 한 번 말해 보면 여기에 쌓여요.</span>';
  const w=Object.entries(store.wrong).sort((a,b)=>b[1]-a[1]).slice(0,8);
  $('historyNote').textContent = w.length ? '자주 틀린 절: '+w.map(([k,n])=>`${k.replace(':','장 ')}절(${n})`).join(', ') : '';
  const an=Object.keys(store.accepted).length; $('btnForget').hidden=!an; $('btnForget').textContent=`인정한 답 ${an}절 지우기`;
}

/* ---------- 음성 입력 ---------- */
let listening=false, engine=null, rec=null, dict=null, base='';
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function setMic(on){ listening=on; keepAwake(on); $('btnMic').classList.toggle('on',on); $('micLabel').textContent = on?'듣는 중 · 다 말하면 한 번 눌러 멈추기':'한 번 눌러 말하기 시작'; if(!on) $('interim').textContent=''; }
function appendFinal(t){ t=t.trim(); if(!t) return; const a=$('answer'); a.value = (a.value.trim()? a.value.trim()+' ':'') + t; }
function useKeyboardOnly(msg){
  engine=null; $('btnMic').hidden=true;
  $('tip').innerHTML = (msg?msg+'<br>':'') + '글상자를 누르고 키보드 아래쪽 <b>마이크 버튼</b>을 눌러 말하세요. 다 말하면 마이크를 다시 눌러 끄고 <b>채점하기</b>를 누르면 돼요. 절 번호는 말하지 마세요.';
}
const MIC_ERR={
  'not-allowed':'마이크 사용이 꺼져 있어요. 주소창 왼쪽 "가가" → 웹 사이트 설정 → 마이크를 "허용"으로 바꾼 뒤 다시 눌러 주세요.',
  'service-not-allowed':'아이폰 받아쓰기가 꺼져 있어요. 설정 → 일반 → 키보드 → "받아쓰기 활성화"를 켠 뒤 다시 눌러 주세요.',
  'audio-capture':'마이크를 찾지 못했어요. 다른 앱이 마이크를 쓰고 있으면 닫고 다시 눌러 주세요.',
  'network':'인터넷 연결이 끊겨 받아쓰지 못했어요. 연결을 확인하고 다시 눌러 주세요.',
  'language-not-supported':'이 브라우저는 한국어 받아쓰기를 지원하지 않아요. Safari로 열어 주세요.'};
let grams=null, startedAt=0, quickEnds=0;
const bigrams = s => { const g=[]; for(let i=0;i<s.length-1;i++) g.push(s[i]+s[i+1]); return g; };
// 받아쓰기가 후보를 여러 개 주면, 지금 외우는 구절과 가장 많이 겹치는 후보를 쓴다
function bestAlt(r){ let best=r[0].transcript, top=-1;
  for(let i=0;i<r.length;i++){ const g=bigrams(sound(norm(r[i].transcript))); const sc=g.length? g.filter(x=>grams.has(x)).length/g.length : 0; if(sc>top){top=sc; best=r[i].transcript;} }
  return best.trim(); }
function micFail(msg){ cancelPendingGrade(); setMic(false); killRec(); $('interim').textContent=msg; }
function killRec(){ const o=rec; rec=null; try{o?.abort()}catch{} }
let afterStop=null, gradeTimer=null;
function cancelPendingGrade(){
  clearTimeout(gradeTimer);
  gradeTimer=null; afterStop=null;
  $('btnGrade').disabled=false;
}
function stopMic(discard){ // discard: 남은 결과도 버린다
  cancelPendingGrade();
  if(engine==='claude'){ if(listening) dict.stop().catch(()=>{}); return; }
  if(listening) setMic(false);
  if(discard) killRec(); else try{rec?.stop()}catch{}
}
function startRec(){
  killRec();
  const r=rec=new SR(); r.lang='ko-KR'; r.continuous=true; r.interimResults=true; r.maxAlternatives=3;
  r.onstart=()=>{ if(r!==rec) return; startedAt=Date.now(); if(listening && $('interim').textContent==='마이크를 켜는 중…') $('interim').textContent='듣고 있어요. 말해 보세요.'; };
  // 아이폰 Safari는 '확정' 표시가 늦거나 같은 결과를 다시 보내서, 매번 이번 구간 전체를 새로 써 넣는다(두 번 들어가지 않게)
  r.onresult=e=>{ if(r!==rec) return; quickEnds=0; const t=Array.from(e.results).map(bestAlt).join(' '); $('answer').value=(base? base+' ':'')+t; if(listening) $('interim').textContent='받아쓰는 중…'; };
  r.onerror=e=>{ if(r!==rec) return; if(MIC_ERR[e.error]) micFail(MIC_ERR[e.error]); }; // no-speech·aborted는 그냥 다시 듣는다
  r.onend=()=>{ if(r!==rec) return;
    if(!listening){ const f=afterStop; afterStop=null; if(f) f(); return; } // 멈춘 뒤 마지막 말까지 받고 나서 채점
    // 켜자마자 꺼지기를 반복하면 멈추고 알려 준다(끝없이 다시 켜지 않게)
    quickEnds = Date.now()-startedAt<1500 ? quickEnds+1 : 0;
    if(quickEnds>=3) return micFail('마이크가 바로 꺼져요. Safari에서 열었는지 확인하고, 안 되면 글상자를 눌러 키보드의 마이크 버튼을 써 주세요.');
    base=$('answer').value.trim(); try{ startRec(); }catch{ micFail('마이크를 다시 켜지 못했어요. 버튼을 한 번 더 눌러 주세요.'); } }; // 아이폰은 잠깐 멈추면 끊겨서 다시 켠다
  r.start();
}
// 길게 말하는 동안 화면이 꺼지면 듣기가 끊긴다
let wake=null;
function keepAwake(on){ try{ if(on) navigator.wakeLock?.request('screen').then(w=>wake=w).catch(()=>{}); else { wake?.release(); wake=null; } }catch{} }
$('btnMic').onclick=()=>{
  if(engine==='claude'){
    if(listening){ dict.stop().catch(()=>{}); return; }
    dict.start().catch(err=>{ setMic(false); if(err&&err.code==='not_granted') useKeyboardOnly('마이크 사용이 허용되지 않았어요.'); });
    setMic(true); return;
  }
  if(engine==='web'){
    if(listening){ stopMic(false); return; }
    if(!$('resultCard').hidden) clearAll(); // 채점한 뒤 다시 말하면 이전 답에 이어 붙지 않게 새로 시작
    cancelPendingGrade(); $('answer').blur(); base=$('answer').value.trim(); quickEnds=0;
    grams=new Set(bigrams(sound(currentKeys().map(k=>norm(VERSES[k])).join(''))));
    setMic(true); $('interim').textContent='마이크를 켜는 중…';
    try{ startRec(); }catch{ micFail('마이크를 켜지 못했어요. 버튼을 한 번 더 눌러 주세요.'); }
  }
};
function initSpeech(){
  if(SR){ engine='web'; $('btnMic').hidden=false;
    $('tip').innerHTML='<b>말하기 시작</b>을 한 번 누르고(누르고 있지 않아도 돼요) 외운 구절을 말하세요. 다 말했으면 한 번 더 눌러 멈추고 <b>채점하기</b>. 절 번호는 말하지 마세요. 마이크 버튼이 안 되면 키보드의 마이크 버튼으로 받아써도 돼요.'; }
  else useKeyboardOnly();
  // claude.ai 안에서 열었을 때(컴퓨터 크롬·데스크톱 앱)는 Claude 받아쓰기를 쓴다
  if(window.claude && typeof window.claude.use==='function'){
    window.claude.use('dictation').then(d=>{ if(!d) return; dict=d; engine='claude'; $('btnMic').hidden=false;
      d.onFinal(({text})=>appendFinal(text)); d.onPartial(({text})=>{$('interim').textContent=text;});
      d.onState(({state})=>setMic(state==='listening'));
      $('tip').innerHTML='<b>말하기 시작</b>을 한 번 누르고(누르고 있지 않아도 돼요) 외운 구절을 말하세요. 다 말했으면 한 번 더 눌러 멈추고 <b>채점하기</b>. 절 번호는 말하지 마세요.';
    }).catch(()=>{});
  }
}

/* ---------- 연결 ---------- */
$('tabVerse').onclick=()=>setMode('verse');
$('tabChapter').onclick=()=>setMode('chapter');
$('selCh').onchange=()=>{ fillVerses(); wrongOnly=null; clearAll(); updatePrompt(); };
$('selV').onchange=()=>{ clearAll(); updatePrompt(); };
$('btnClear').onclick=()=>{ clearAll(); };
function doGrade(){ const a=$('answer').value; if(!norm(a)) return; showResult(grade(currentKeys(), a)); }
$('btnGrade').onclick=()=>{
  if(listening && engine==='web'){
    stopMic(false); $('interim').textContent='마지막 말을 받아쓰는 중…';
    const go=()=>{ cancelPendingGrade(); $('interim').textContent=''; doGrade(); };
    $('btnGrade').disabled=true;
    afterStop=go;
    gradeTimer=setTimeout(go, 2000);
    return;
  }
  if(listening) stopMic(false);
  doGrade();
};
$('btnForget').onclick=()=>{ store.accepted={}; save(); renderHistory(); };
fillChapters(); fillVerses(); updatePrompt(); initSpeech(); renderHistory();
window.__rv = {grade, fixDigits, norm, sound, VERSES, store};
document.querySelector('.wrap').hidden=false;
$('loadStatus').hidden=true;
}
initializeRecite().catch(error=>{
 console.error(error);
 document.querySelector('#loadStatus').textContent='본문을 불러오지 못했어요. 연결을 확인하고 새로고침해 주세요.';
});
</script>
</body></html>
